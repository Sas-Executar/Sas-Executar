<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scanner OCR · Playwright</title>
    <style>
    body {
      padding: 24px;
      margin: 0;
      font:
        16px / 1.5 system-ui,
        sans-serif;
      color: #111;
      background: #f5f5f5;
    }
    #samples {
      display: grid;
      grid-template-columns: repeat(5, 240px);
      gap: 16px;
    }
    canvas {
      width: 240px;
      height: 160px;
      background: #fff;
      border: 1px solid #bbb;
    }
    pre {
      white-space: pre-wrap;
    }
    </style>
  </head>
  <body>
    <h1>Validação dos cinco símbolos</h1>
    <p id="status">Preparando o Tesseract…</p>
    <div id="samples"></div>
    <pre id="result"></pre>
    <script type="module">
    import {
      createWorker,
      OEM,
      PSM,
    } from "/node_modules/tesseract.js/dist/tesseract.esm.min.js";

    const words = ["ENTRADA", "COPILOTO", "SELETOR", "FEITO", "SAIDA"];
    const samples = document.querySelector("#samples");
    const canvases = words.map((word) => {
      const canvas = document.createElement("canvas");
      canvas.width = 480;
      canvas.height = 320;
      const context = canvas.getContext("2d");
      context.fillStyle = "#fff";
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = "#000";
      context.font = "700 68px Arial";
      context.textAlign = "center";
      context.textBaseline = "middle";
      context.fillText(word, canvas.width / 2, canvas.height / 2);
      samples.append(canvas);
      return canvas;
    });

    const worker = await createWorker("eng", OEM.LSTM_ONLY, {
      corePath: "/node_modules/tesseract.js-core",
      langPath: "/node_modules/@tesseract.js-data/eng/4.0.0",
      workerPath: "/node_modules/tesseract.js/dist/worker.min.js",
    });
    await worker.setParameters({
      tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
      tessedit_pageseg_mode: PSM.SINGLE_WORD,
      user_defined_dpi: "300",
    });

    const results = [];
    for (let index = 0; index < canvases.length; index += 1) {
      const startedAt = performance.now();
      const recognition = await worker.recognize(canvases[index]);
      const latencyMs = Math.round(performance.now() - startedAt);
      const text = recognition.data.text.replace(/[^A-Z]/gi, "").toUpperCase();
      results.push({
        expected: words[index],
        latencyMs,
        passed: text.includes(words[index]) && latencyMs < 3000,
        text,
      });
    }
    await worker.terminate();

    window.__scannerOcrResult = results;
    document.querySelector("#result").textContent = JSON.stringify(
      results,
      null,
      2
    );
    const passed = results.every((item) => item.passed);
    const status = document.querySelector("#status");
    status.textContent = passed ? "PASS · cinco leituras abaixo de 3s" : "FAIL";
    status.dataset.result = passed ? "pass" : "fail";
    </script>
  </body>
</html>
