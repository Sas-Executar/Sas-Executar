name: Mobile · lockfile bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    name: Gerar bun.lock para revisão
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Resolver dependências sem instalar
        run: bun install --lockfile-only
      - name: Publicar lockfile efêmero
        uses: actions/upload-artifact@v6
        with:
          name: mobile-bun-lock-${{ github.sha }}
          path: bun.lock
          retention-days: 1
