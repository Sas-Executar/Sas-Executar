version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"

  # Maintain Bun workspace dependencies and its text lockfile
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    open-pull-requests-limit: 10
    groups:
      workspace-updates:
        group-by: dependency-name
    ignore:
      - dependency-name: "@biomejs/biome"
        versions: ["2.5.x"]
    schedule:
      interval: "monthly"
